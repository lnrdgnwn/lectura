basePath: /api/v1
consumes:
- application/json
definitions:
  models.ChapterCreateRequest:
    properties:
      content:
        example: Isi chapter...
        type: string
      novel_id:
        example: 1
        type: integer
      publish:
        example: true
        type: boolean
      title:
        example: Chapter 1
        type: string
    type: object
  models.ChapterUpdateRequest:
    properties:
      content:
        example: Isi baru
        type: string
      order_no:
        example: 2
        type: integer
      publish:
        example: true
        type: boolean
      title:
        example: Judul baru
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  models.LogoutRequest:
    properties:
      refresh_token:
        example: <encrypted_refresh_token>
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: your.email@example.com
    name: Your Name
  description: REST API platform lECTURA (auth, users, novels, chapters, genres, tags,
    bookmarks).
  title: Final Project Novel API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email & password. Token dikirim via cookie HttpOnly.
      parameters:
      - description: Data login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login sukses
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user. Menghapus refresh token dari Redis/DB dan mengosongkan
        cookie.
      parameters:
      - description: Opsional jika tidak pakai cookie
        in: body
        name: body
        schema:
          $ref: '#/definitions/models.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout sukses
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Menggunakan refresh_token (cookie) untuk membuat access_token baru
        (dan rotate refresh_token).
      produces:
      - application/json
      responses:
        "200":
          description: Refresh token sukses, token baru diset di cookie
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Refresh token tidak tersedia/invalid/kedaluwarsa
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat/simpan token baru
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Membuat akun baru dengan username, email, dan password. Role default:
        user.'
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User berhasil terdaftar
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register user baru
      tags:
      - Auth
  /bookmarks:
    get:
      description: Mengambil daftar bookmark milik user yang sedang login, termasuk
        info singkat novel.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar bookmark dengan meta pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: List bookmark milik user
      tags:
      - Bookmarks
    post:
      consumes:
      - application/json
      description: Menambahkan novel ke daftar bookmark user yang sedang login.
      parameters:
      - description: 'novel_id, contoh: {\'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Bookmark ditambahkan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / novel_id kosong
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Novel sudah dibookmark
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menambahkan bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Tambah bookmark novel
      tags:
      - Bookmarks
  /bookmarks/{id}:
    delete:
      description: Menghapus satu bookmark milik user yang sedang login berdasarkan
        bookmark_id.
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Bookmark dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Bookmark tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus bookmark
      tags:
      - Bookmarks
  /bookmarks/novels:
    get:
      description: Mengambil daftar novel yang dibookmark oleh user login, lengkap
        dengan author & chapters.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar novel dari bookmark dengan meta pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Daftar novel dari bookmark user
      tags:
      - Bookmarks
  /chapters:
    get:
      consumes:
      - application/json
      description: Mengambil daftar chapter. Non-admin hanya melihat chapter yang
        sudah terbit. Admin bisa melihat semua.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Filter berdasarkan ID novel
        in: query
        name: novel_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar chapter + meta pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: novel_id tidak valid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data chapter
          schema:
            additionalProperties: true
            type: object
      summary: Ambil daftar chapter (global)
      tags:
      - Chapters
    post:
      consumes:
      - application/json
      description: Menambahkan chapter baru ke novel. Hanya author novel atau admin
        yang boleh menambah.
      parameters:
      - description: Data chapter baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChapterCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Chapter dibuat (draft / terbit)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / field wajib kosong
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang untuk novel ini
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menambah chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Tambah chapter baru
      tags:
      - Chapters
  /chapters/{id}:
    delete:
      description: Menghapus chapter. Hanya author novel atau admin yang boleh.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Chapter dihapus
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus chapter
      tags:
      - Chapters
    get:
      description: Mengambil detail satu chapter. Draft hanya bisa diakses oleh author
        novel atau admin.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail chapter
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang mengakses draft
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil chapter
          schema:
            additionalProperties: true
            type: object
      summary: Detail chapter
      tags:
      - Chapters
    put:
      consumes:
      - application/json
      description: Mengubah data chapter (judul, konten, urutan, status publish).
        Hanya author novel atau admin.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      - description: Data update chapter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChapterUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Chapter diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / order_no tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter atau novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memperbarui chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Update chapter
      tags:
      - Chapters
  /novels/{novel_id}/chapters:
    get:
      description: Mengambil semua chapter untuk suatu novel. User biasa hanya melihat
        yang sudah terbit, author & admin bisa melihat termasuk draft.
      parameters:
      - description: ID Novel
        in: path
        name: novel_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar chapter
          schema:
            additionalProperties: true
            type: object
        "400":
          description: novel_id tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil chapter
          schema:
            additionalProperties: true
            type: object
      summary: Daftar chapter per novel
      tags:
      - Chapters
produces:
- application/json
schemes:
- http
swagger: "2.0"

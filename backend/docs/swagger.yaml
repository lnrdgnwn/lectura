basePath: /api/v1
consumes:
- application/json
definitions:
  models.ChapterCreateRequest:
    properties:
      content:
        example: Isi chapter...
        type: string
      novel_id:
        example: 1
        type: integer
      publish:
        example: true
        type: boolean
      title:
        example: Chapter 1
        type: string
    type: object
  models.ChapterUpdateRequest:
    properties:
      content:
        example: Isi baru
        type: string
      order_no:
        example: 2
        type: integer
      publish:
        example: true
        type: boolean
      title:
        example: Judul baru
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  models.LogoutRequest:
    properties:
      refresh_token:
        example: <encrypted_refresh_token>
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: your.email@example.com
    name: Your Name
  description: REST API platform lECTURA (auth, users, novels, chapters, genres, tags,
    bookmarks).
  title: Final Project Novel API
  version: "1.0"
paths:
  /admin/genres/home:
    put:
      consumes:
      - application/json
      description: Mengatur ulang daftar genre yang memiliki show_on_home = true berdasarkan
        genre_ids yang dikirim. Hanya untuk admin.
      parameters:
      - description: 'Body: {\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Genre untuk halaman utama berhasil diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / genre_ids kosong / genre tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memperbarui genre halaman utama
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Atur genre yang tampil di halaman utama
      tags:
      - Genres
  /admin/users:
    get:
      consumes:
      - application/json
      description: Mengambil daftar user dengan pagination. Hanya bisa diakses oleh
        admin.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar user + meta pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil daftar user
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: List semua user (admin)
      tags:
      - Users
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus user berdasarkan ID. Hanya bisa diakses oleh admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parameter id wajib / tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus user
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus user (admin)
      tags:
      - Users
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email & password. Token dikirim via cookie HttpOnly.
      parameters:
      - description: Data login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login sukses
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user. Menghapus refresh token dari Redis/DB dan mengosongkan
        cookie.
      parameters:
      - description: Opsional jika tidak pakai cookie
        in: body
        name: body
        schema:
          $ref: '#/definitions/models.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout sukses
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Menggunakan refresh_token (cookie) untuk membuat access_token baru
        (dan rotate refresh_token).
      produces:
      - application/json
      responses:
        "200":
          description: Refresh token sukses, token baru diset di cookie
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Refresh token tidak tersedia/invalid/kedaluwarsa
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat/simpan token baru
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Membuat akun baru dengan username, email, dan password. Role default:
        user.'
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User berhasil terdaftar
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register user baru
      tags:
      - Auth
  /bookmarks:
    get:
      description: Mengambil daftar bookmark milik user yang sedang login, termasuk
        info singkat novel.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar bookmark dengan meta pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: List bookmark milik user
      tags:
      - Bookmarks
    post:
      consumes:
      - application/json
      description: Menambahkan novel ke daftar bookmark user yang sedang login.
      parameters:
      - description: 'novel_id, contoh: {\'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Bookmark ditambahkan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / novel_id kosong
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Novel sudah dibookmark
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menambahkan bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Tambah bookmark novel
      tags:
      - Bookmarks
  /bookmarks/{id}:
    delete:
      description: Menghapus satu bookmark milik user yang sedang login berdasarkan
        bookmark_id.
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Bookmark dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Bookmark tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus bookmark
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus bookmark
      tags:
      - Bookmarks
  /bookmarks/novels:
    get:
      description: Mengambil daftar novel yang dibookmark oleh user login, lengkap
        dengan author & chapters.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar novel dari bookmark dengan meta pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Daftar novel dari bookmark user
      tags:
      - Bookmarks
  /chapters:
    get:
      consumes:
      - application/json
      description: Mengambil daftar chapter. Non-admin hanya melihat chapter yang
        sudah terbit. Admin bisa melihat semua.
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Filter berdasarkan ID novel
        in: query
        name: novel_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar chapter + meta pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: novel_id tidak valid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data chapter
          schema:
            additionalProperties: true
            type: object
      summary: Ambil daftar chapter (global)
      tags:
      - Chapters
    post:
      consumes:
      - application/json
      description: Menambahkan chapter baru ke novel. Hanya author novel atau admin
        yang boleh menambah.
      parameters:
      - description: Data chapter baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChapterCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Chapter dibuat (draft / terbit)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / field wajib kosong
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang untuk novel ini
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menambah chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Tambah chapter baru
      tags:
      - Chapters
  /chapters/{id}:
    delete:
      description: Menghapus chapter. Hanya author novel atau admin yang boleh.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Chapter dihapus
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus chapter
      tags:
      - Chapters
    get:
      description: Mengambil detail satu chapter. Draft hanya bisa diakses oleh author
        novel atau admin.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail chapter
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang mengakses draft
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil chapter
          schema:
            additionalProperties: true
            type: object
      summary: Detail chapter
      tags:
      - Chapters
    put:
      consumes:
      - application/json
      description: Mengubah data chapter (judul, konten, urutan, status publish).
        Hanya author novel atau admin.
      parameters:
      - description: ID Chapter
        in: path
        name: id
        required: true
        type: integer
      - description: Data update chapter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChapterUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Chapter diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / order_no tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Chapter atau novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memperbarui chapter
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Update chapter
      tags:
      - Chapters
  /genres:
    get:
      consumes:
      - application/json
      description: Mengambil daftar genre dengan opsi pencarian dan pagination.
      parameters:
      - description: Cari berdasarkan name atau slug
        in: query
        name: q
        type: string
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar genre + meta pagination
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil daftar genre
          schema:
            additionalProperties: true
            type: object
      summary: List genre
      tags:
      - Genres
    post:
      consumes:
      - application/json
      description: Membuat genre baru dengan name dan slug unik.
      parameters:
      - description: 'Body: {\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Genre berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / field wajib kosong
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Name atau slug sudah digunakan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat genre
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Buat genre baru
      tags:
      - Genres
  /genres/{id}:
    delete:
      description: Menghapus genre berdasarkan ID atau slug. Relasi many2many ke novel
        akan ikut terhapus karena constraint OnDelete:CASCADE di join table.
      parameters:
      - description: ID atau slug genre
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Genre berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Genre tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus genre
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus genre
      tags:
      - Genres
    get:
      consumes:
      - application/json
      description: Mengambil detail genre berdasarkan ID atau slug.
      parameters:
      - description: ID atau slug genre
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail genre
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Genre tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil genre
          schema:
            additionalProperties: true
            type: object
      summary: Detail genre
      tags:
      - Genres
    put:
      consumes:
      - application/json
      description: Mengubah name dan/atau slug genre berdasarkan ID atau slug. Wajib
        unik.
      parameters:
      - description: ID atau slug genre
        in: path
        name: id
        required: true
        type: string
      - description: 'Body: {\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Genre berhasil diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / field kosong
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Genre tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Name atau slug sudah digunakan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memperbarui genre
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Update genre
      tags:
      - Genres
  /genres/home:
    get:
      consumes:
      - application/json
      description: Mengambil daftar genre yang ditandai tampil di halaman utama (show_on_home
        = true).
      produces:
      - application/json
      responses:
        "200":
          description: Daftar genre untuk halaman utama
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil genre
          schema:
            additionalProperties: true
            type: object
      summary: List genre untuk halaman utama
      tags:
      - Genres
  /novels:
    get:
      description: |-
        Mengambil semua novel dengan genres, tags, info author (username & profile_picture), dan chapters yang boleh diakses.
        - Admin: semua chapters.
        - User login: chapter published + semua chapter novel miliknya.
        - Tanpa login: hanya chapter yang sudah published.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar novel
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil novel
          schema:
            additionalProperties: true
            type: object
      summary: Ambil semua novel
      tags:
      - Novels
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Membuat novel baru milik user login, dengan optional genres & tags.
        Status hanya boleh ongoing, completed, atau hiatus.
      parameters:
      - description: Judul novel
        example: '"Judul Keren"'
        in: formData
        name: title
        required: true
        type: string
      - description: Slug unik novel
        example: '"judul-keren"'
        in: formData
        name: slug
        required: true
        type: string
      - description: Sinopsis novel
        in: formData
        name: synopsis
        type: string
      - description: URL cover (jika tidak upload file)
        in: formData
        name: cover_url
        type: string
      - description: File cover (opsional, multipart)
        in: formData
        name: cover_image
        type: file
      - description: 'Status (ongoing, completed, hiatus). Default: ongoing'
        in: formData
        name: status
        type: string
      - collectionFormat: csv
        description: Array ID genre (maksimal 1 genre)
        in: formData
        items:
          type: integer
        name: genre_ids
        type: array
      - collectionFormat: csv
        description: Array ID tag
        in: formData
        items:
          type: integer
        name: tag_ids
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Novel dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / field wajib kosong / status tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat novel
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Buat novel baru
      tags:
      - Novels
  /novels/{id}:
    delete:
      description: Menghapus novel milik author atau oleh admin.
      parameters:
      - description: ID Novel
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Novel dihapus
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang menghapus novel
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus novel
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Hapus novel
      tags:
      - Novels
    get:
      description: |-
        Mengambil detail novel berdasarkan ID, termasuk genres, tags, author (username & profile_picture), dan daftar chapters.
        - Admin/Author: semua chapters (termasuk draft).
        - User lain/tanpa login: hanya chapter yang sudah published.
      parameters:
      - description: ID Novel
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail novel
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil novel
          schema:
            additionalProperties: true
            type: object
      summary: Detail novel
      tags:
      - Novels
    put:
      consumes:
      - application/json
      - multipart/form-data
      description: Memperbarui novel milik author (atau admin), termasuk title, synopsis,
        cover, status, genre, dan tag. Mengembalikan detail lengkap novel + author
        + chapters.
      parameters:
      - description: ID Novel
        in: path
        name: id
        required: true
        type: integer
      - description: Judul novel
        in: formData
        name: title
        type: string
      - description: Sinopsis novel
        in: formData
        name: synopsis
        type: string
      - description: URL cover baru atau path file yang diupload
        in: formData
        name: cover_image
        type: string
      - description: File cover (opsional, multipart)
        in: formData
        name: cover_image
        type: file
      - description: Status (ongoing, completed, hiatus)
        in: formData
        name: status
        type: string
      - collectionFormat: csv
        description: Array ID genre (maksimal 1 genre). Jika kosong [] akan menghapus
          semua genre.
        in: formData
        items:
          type: integer
        name: genre_ids
        type: array
      - collectionFormat: csv
        description: Array ID tag. Jika kosong [] akan menghapus semua tag.
        in: formData
        items:
          type: integer
        name: tag_ids
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Novel diperbarui (detail lengkap)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload tidak valid / status tidak valid / genre/tag tidak
            ditemukan
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak berwenang mengubah novel
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Novel tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menyimpan perubahan / memuat ulang novel
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Perbarui novel
      tags:
      - Novels
